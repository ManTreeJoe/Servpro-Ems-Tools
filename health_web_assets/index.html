<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Data & Sync Health</title>
  <link rel="stylesheet" href="../web_shared/theme.css">
  <link rel="stylesheet" href="app.css?v=20260825a">
  <script src="../web_shared/iframe_shim.js"></script>
  <script src="../web_shared/usage_track.js?v=20260825a"></script>
  <script src="../web_shared/progress_bar.js?v=20260820a"></script>
<meta name="theme-color" content="#1A1A1A" />
<link rel="stylesheet" href="../web_shared/responsive.css?v=20260828a" />
</head>
<body class="responsive-ui">
  <header class="topbar">
    <div>
      <div class="eyebrow">System preflight</div>
      <h1>Data & Sync Health</h1>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="health-refresh">Refresh checks</button>
      <button class="btn" id="health-backup">Run backup now</button>
    </div>
  </header>
  <main>
    <section class="readiness" id="readiness" aria-live="polite">
      <div class="signal" aria-hidden="true"></div>
      <div><div class="readiness-title">Checking…</div>
      <div class="readiness-detail">Reviewing local paths, connections, and backups.</div></div>
    </section>
    <section>
      <h2>Work connections</h2>
      <div class="check-list" id="connections"></div>
    </section>
    <section>
      <h2>Backups</h2>
      <div class="check-list" id="backups"></div>
    </section>
  </main>
  <footer class="statusbar"><span id="health-status">Ready</span></footer>
  <script src="app.js?v=20260825a"></script>
</body>
</html>
