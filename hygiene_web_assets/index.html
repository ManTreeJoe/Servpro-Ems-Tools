<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../web_shared/usage_track.js?v=20260825a"></script>
<meta charset="UTF-8" />
<title>Hygiene — Linguar Hub</title>
<script src="../web_shared/appearance.js?v=20260901a"></script>
<link rel="stylesheet" href="../web_shared/theme.css?v=20260901a" />
<link rel="stylesheet" href="theme.css" />
<script src="../web_shared/health_banner.js?v=20260820a"></script>
<script src="../web_shared/progress_bar.js?v=20260818a"></script>
<script src="../web_shared/iframe_shim.js?v=20260818b"></script>
<script src="../web_shared/panel_state.js?v=20260811a"></script>
<script src="../web_shared/util.js?v=20260731j"></script>
<script src="../web_shared/ctx_menu.js?v=20260731j"></script>
<script src="../web_shared/trello_hover.js?v=20260812a"></script>
<script src="../web_shared/toast_log.js?v=20260731j"></script>
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="../web_shared/hygiene_board.css?v=20260723a" />
<script src="../web_shared/hygiene_board.js?v=20260731j"></script>
<script src="../web_shared/request_items.js?v=20260731j"></script>
<style>
  /* Simple-first: the job board is the default; the legacy section feed
     is hidden until the user flips "⚙ Sections". */
  body:not(.show-legacy) .tiles,
  body:not(.show-legacy) .feed-wrap { display: none; }
  body.show-legacy #board-view { display: none; }
  #board-view { padding: 6px 14px 20px; }
  #board-view .hb-head { padding-top: 12px; }
  #view-toggle.on { background: var(--chip-active, #2d4636); color: #fff; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1A1A1A" />
<link rel="stylesheet" href="../web_shared/responsive.css?v=20260828a" />
</head>
<body class="responsive-ui">
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">SERVPRO · Hygiene</span>
    <span class="brand-tag">priority</span>
  </div>
  <span class="spacer"></span>
  <select id="board-filter" class="search" style="width:170px;">
    <option value="">All boards</option>
  </select>
  <input id="search-box" class="search" type="search" placeholder="🔎 Filter…" style="width:180px;" />
  <span id="cache-age" class="muted">—</span>
  <select id="scan-tab" class="search" style="width:150px;" title="Limit the scan to one group of sections (faster / lighter than a full scan)">
    <option value="">⟳ All tabs</option>
  </select>
  <button id="scan-btn" class="btn btn-primary" title="Re-scan every section on every in-scope board">↻ Run scan</button>
  <button id="scan-min-btn" class="btn" title="Hygiene rules only · 50 cards/board cap · no side-fetches. Use if a full scan times out / OOMs.">⚡ Minimal</button>
  <button id="xa-scan-btn" class="btn" title="Scan the Outlook inbox for XA adjuster inquiries (questions/requests) AND adjuster receipts to review">📨 Inbox scan</button>
  <button id="cancel-btn" class="btn hidden" title="Stop the running scan">✕ Cancel</button>
  <button id="view-toggle" class="btn" title="Toggle between the simple job board and the full section feed">⚙ Sections</button>
  <button id="diag-btn" class="btn" title="Scan diagnostics &amp; clear cache (use if the panel is slow or your laptop is low on memory)">🩺</button>
</header>

<section class="board-view" id="board-view"></section>

<section class="tiles" id="tiles"></section>

<main class="feed-wrap">
  <div class="feed-head">
    <span class="title" id="feed-title">All action items</span>
    <span class="spacer"></span>
    <label title="Include the full list of every open Trello job (large)">
      <input type="checkbox" id="show-open-jobs" /> Show all open jobs
    </label>
    <span class="muted" id="feed-count">—</span>
  </div>
  <div class="feed" id="feed"></div>
  <div id="feed-empty" class="empty hidden">Nothing needs attention right now 🎉</div>
</main>

<footer class="statusbar">
  <span id="scan-state" class="muted">—</span>
  <span class="spacer"></span>
  <span id="status-msg" class="status-msg"></span>
</footer>
<script>
  // Simple job board = default view. Self-contained so it doesn't depend
  // on app.js's (heavy) scan/feed machinery — the legacy feed lives behind
  // the ⚙ Sections toggle and renders exactly as before when shown.
  (function () {
    var booted = false;
    function setStatus(m) { var e = document.getElementById("status-msg"); if (e) e.textContent = m; }
    function renderBoard() {
      var el = document.getElementById("board-view");
      if (el && window.HygieneBoard && window.pywebview && window.pywebview.api)
        window.HygieneBoard.render(el, { api: window.pywebview.api, setStatus: setStatus });
    }
    function boot() {
      if (booted) return; booted = true;
      var t = document.getElementById("view-toggle");
      if (t) t.addEventListener("click", function () {
        var on = document.body.classList.toggle("show-legacy");
        t.classList.toggle("on", on);
        t.textContent = on ? "🩺 Board" : "⚙ Sections";
        if (!on) renderBoard();
      });
      renderBoard();
    }
    if (window.pywebview && window.pywebview.api) boot();
    else window.addEventListener("pywebviewready", boot, { once: true });
    setTimeout(function () { if (!booted && window.pywebview && window.pywebview.api) boot(); }, 1500);
  })();
</script>
<script src="app.js?v=20260811a"></script>
</body>
</html>
