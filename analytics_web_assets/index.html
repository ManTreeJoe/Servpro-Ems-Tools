<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics — Linguar Hub</title>
<meta name="theme-color" content="#205840">
<link rel="stylesheet" href="../web_shared/workspace_controls.css?v=20260910a">
<link rel="stylesheet" href="../web_shared/responsive.css?v=20260828a">
<script src="../web_shared/progress_bar.js"></script>
<script src="../web_shared/appearance.js?v=20260901a"></script>
<script src="../web_shared/iframe_shim.js?v=20260818b"></script>
<script src="../web_shared/text_context_menu.js?v=20260903a"></script>
<script src="../web_shared/usage_track.js?v=20260825a"></script>
<link rel="stylesheet" href="app.css?v=20260911a"></head>
<body class="responsive-ui"><header><div><small id="location">Linguar Hub</small><h1>Analytics</h1></div><div class="actions"><button id="apa">APA monitor</button><button id="export">Export CSV</button><button id="refresh">Refresh</button></div></header>
<main><nav id="tabs" aria-label="Analytics views"></nav>
<form id="filters"><label>From<input type="date" name="start" required></label><label>Through<input type="date" name="end" required></label><label>Division<select name="division"><option value="">All divisions</option><option>EMS</option><option>CONTENTS</option><option>RECON</option></select></label><label>Status<select name="status"><option value="active_recent">Active and recently billed</option><option value="all">All records</option><option value="open">Open</option><option value="billed">Billed</option><option value="paid">Paid</option><option value="closed">Closed</option><option value="archived">Archived</option></select></label><label>Find a Loss<input name="query" type="search" placeholder="Name or carrier"></label><details><summary>More filters</summary><div id="extra-filters"></div></details><button class="primary">Apply filters</button></form>
<p id="status" role="status">Loading analytics…</p><div id="coverage"></div><section id="view"></section>
<section class="panel" id="records"><div class="section-head"><h2 id="record-title">Records</h2><span id="record-count"></span></div><div class="table-wrap"><table><thead><tr><th>Loss / job</th><th>Division</th><th>Stage</th><th>Carrier</th><th>Received</th><th>Review</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<dialog id="review"><form method="dialog"><div class="section-head"><h2 id="review-title">Weekly review</h2><button value="cancel" aria-label="Close review">×</button></div><p>Review notes are saved on this PC for the current workspace.</p><label>Correction / review note<textarea id="review-note" rows="5"></textarea></label><div class="review-fields"><label>Owner<input id="review-owner"></label><label>Due date<input id="review-due" type="date"></label><label>Outcome<select id="review-outcome"><option value="reviewed">Reviewed</option><option value="follow_up">Follow-up required</option><option value="resolved">Correction resolved</option></select></label></div><p id="review-error" role="alert"></p><button type="button" class="primary" id="save-review">Save review</button></form></dialog>
<script src="app.js?v=20260911a"></script></body></html>
