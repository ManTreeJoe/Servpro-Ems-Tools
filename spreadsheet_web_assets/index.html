<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spreadsheets — Linguar Hub</title>
<link rel="stylesheet" href="theme.css" />
<script src="../web_shared/iframe_shim.js"></script>
<script src="../web_shared/util.js"></script>
<script src="../web_shared/keyboard.js"></script>
<script src="../web_shared/toast_log.js"></script>
<style>
  body { display: flex; flex-direction: column; }
  .split { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
  .wb-list {
    background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px;
  }
  .wb-item {
    display: flex; flex-direction: column;
    padding: 10px 12px; margin-bottom: 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer;
    transition: background 80ms ease;
  }
  .wb-item:hover { background: var(--surface-2); }
  .wb-item.active { border-color: var(--green); background: var(--surface-2); }
  .wb-item.missing { opacity: 0.55; }
  .wb-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .wb-path { font-size: 10px; color: var(--text-muted); font-family: monospace;
             word-break: break-all; margin-top: 3px; }
  .viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .viewer-head {
    padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .viewer-head .title { font-weight: 600; font-size: 13px; }
  .viewer-head .pillchip {
    background: var(--chip-bg); color: var(--text-muted);
    padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700;
  }
  .viewer-head .search { width: 220px; font-size: 12px; padding: 4px 10px; }
  .viewer-head select { font-size: 12px; padding: 4px 8px; }
  .viewer-body {
    flex: 1; overflow: auto; padding: 0;
  }
  table.rows {
    width: 100%; border-collapse: collapse; font-size: 12px;
    background: var(--bg);
  }
  table.rows thead { position: sticky; top: 0; z-index: 5; }
  table.rows th {
    background: var(--surface);
    font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-muted);
    padding: 8px 10px; text-align: left;
    border-bottom: 1px solid var(--border);
  }
  table.rows td {
    padding: 5px 10px; border-bottom: 1px solid #2A2A2A;
    color: var(--text); vertical-align: top;
    max-width: 380px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  table.rows tr:hover td { background: var(--row-hover); }
  table.rows tr[data-tag] td { background-color: attr(data-tag-color); }
  .empty { padding: 40px; text-align: center; color: var(--text-muted); font-style: italic; }
  #status-overlay {
    position:fixed;bottom:20px;right:20px;z-index:200;display:none;
    padding:10px 16px;background:var(--surface);border:1px solid var(--border);
    border-radius:6px;font-size:13px;color:var(--text);max-width:420px;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark"></span>
    <span class="brand-name">SERVPRO · Spreadsheets</span>
    <span class="brand-tag">web · viewer</span>
  </div>
  <div class="topbar-actions">
    <button class="btn" id="dedupe-btn" title="Find + merge duplicate rows in Snapshots workbook">🧹 Dedupe Snapshots</button>
    <button class="btn" id="recon-btn" title="Cross-check Snapshots workbook against Trello">🔄 Reconcile w/ Trello</button>
    <button class="btn" id="notes-btn" title="Generate today's audit notes Markdown">📝 Generate daily notes</button>
    <button class="btn btn-primary" id="add-wb-btn" title="Register a new .xlsx to view here">➕ Add workbook</button>
  </div>
</header>

<div class="split">
  <aside class="wb-list" id="wb-list"></aside>
  <section class="viewer">
    <div class="viewer-head" id="viewer-head"></div>
    <div class="viewer-body" id="viewer-body">
      <div class="empty">Pick a workbook on the left to view rows in-app.</div>
    </div>
  </section>
</div>

<div id="status-overlay"></div>

<script>
"use strict";
const state = {
  workbooks: [],
  active: "",
  view:   null,    // last view_workbook payload
  sheet:  "All",
  search: "",
};
const $ = (s) => document.querySelector(s);
function toast(msg, kind = "") {
  const el = document.getElementById("status-overlay");
  el.textContent = msg;
  el.style.borderColor = kind === "ok" ? "var(--green)"
                        : kind === "error" ? "var(--red)"
                        : "var(--border)";
  el.style.display = "block";
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.style.display = "none", 5000);
}
function esc(s) {
  return String(s ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

window.addEventListener("pywebviewready", async () => {
  state.workbooks = await pywebview.api.workbooks() || [];
  renderList();
  // Auto-open the first available workbook so the viewer isn't blank
  const first = state.workbooks.find((w) => w.exists);
  if (first) openWorkbook(first.key);
  // Topbar utility buttons (existing)
  $("#dedupe-btn").addEventListener("click", onDedupe);
  $("#recon-btn").addEventListener("click", onRecon);
  $("#notes-btn").addEventListener("click", onNotes);
  $("#add-wb-btn").addEventListener("click", onAddWorkbook);
  window.addEventListener("recon:progress", (e) => {
    const d = e.detail || {};
    toast(`🔄 ${d.label || "…"} ${d.done || 0}/${d.total || "?"}`);
  });
  window.addEventListener("recon:done", async (e) => {
    const d = e.detail || {};
    if (d.ok) {
      toast(`✓ Reconcile done — ${(d.result?.drift_count || 0)} drift rows`, "ok");
      if (state.active) await openWorkbook(state.active);
    } else {
      toast(`Reconcile failed: ${d.error || "?"}`, "error");
    }
  });
});

function renderList() {
  $("#wb-list").innerHTML = state.workbooks.map((w) => `
    <div class="wb-item ${w.exists ? "" : "missing"} ${w.key === state.active ? "active" : ""}"
         data-key="${esc(w.key)}" data-path="${esc(w.path)}" data-user="${w.is_user ? "1" : "0"}">
      <div class="wb-name">${esc(w.name)}${w.is_user ? ` <span style="font-size:9px;font-weight:700;background:var(--act-monitor);color:#FFF;padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em;">User</span>` : ""}</div>
      <div class="wb-path">${esc(w.path || "(no path)")}</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn open-external" data-path="${esc(w.path)}" ${w.exists ? "" : "disabled"}
                style="font-size:10px;padding:3px 8px;">📊 Open in Excel</button>
        ${w.is_user ? `<button class="btn wb-remove" data-key="${esc(w.key)}" data-name="${esc(w.name)}"
                style="font-size:10px;padding:3px 8px;color:var(--red);"
                title="Remove this user-added workbook (built-ins can't be removed)">✕ Remove</button>` : ""}
      </div>
    </div>`).join("");
  document.querySelectorAll(".wb-item").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest(".open-external")) return;
      if (e.target.closest(".wb-remove")) return;
      openWorkbook(el.dataset.key);
    });
  });
  document.querySelectorAll(".wb-remove").forEach((b) =>
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const name = b.dataset.name || b.dataset.key;
      if (!confirm(`Remove "${name}" from the sidebar?\n\nThe Excel file on disk stays — this only un-registers the workbook from the Spreadsheets panel.`)) return;
      b.disabled = true; b.textContent = "Removing…";
      const res = await pywebview.api.remove_workbook(b.dataset.key);
      if (!res?.ok) {
        b.disabled = false; b.textContent = "✕ Remove";
        toast(`Remove failed: ${res?.error || "?"}`, "error");
        return;
      }
      toast(`✕ Removed "${name}"`, "ok");
      // Re-fetch + render the sidebar so the entry disappears + a
      // sibling becomes the new active selection if needed.
      state.workbooks = await pywebview.api.workbooks() || [];
      if (state.active === b.dataset.key) {
        state.active = "";
        $("#viewer-head").innerHTML = "";
        $("#viewer-body").innerHTML = `<div class="empty">Pick a workbook on the left to view rows in-app.</div>`;
      }
      renderList();
    }));
  document.querySelectorAll(".open-external").forEach((b) =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      pywebview.api.open_file(b.dataset.path);
    }));
}

async function openWorkbook(key) {
  if (!key) return;
  state.active = key;
  renderList();
  $("#viewer-body").innerHTML = `<div class="empty">Loading rows…</div>`;
  let view;
  try { view = await pywebview.api.view_workbook(key); }
  catch (e) { view = null; }
  if (!view?.ok) {
    $("#viewer-body").innerHTML =
      `<div class="empty" style="color:var(--red);">Failed to load: ${esc(view?.error || "?")}</div>`;
    $("#viewer-head").innerHTML = "";
    return;
  }
  state.view = view;
  state.sheet = "All";
  state.search = "";
  renderHead();
  renderTable();
}

function renderHead() {
  const v = state.view;
  if (!v) { $("#viewer-head").innerHTML = ""; return; }
  const sheetOptions = ["All", ...(v.sheets || [])];
  $("#viewer-head").innerHTML = `
    <span class="title">${esc(v.label)}</span>
    <span class="pillchip" id="row-count">${v.total} rows</span>
    ${(v.sheets || []).length ? `
      <label style="font-size:11px;color:var(--text-muted);">Sheet:</label>
      <select id="sheet-filter">${sheetOptions.map((s) => `<option ${s === state.sheet ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
    ` : ""}
    <input id="search-box" class="search" type="search" placeholder="🔎 Filter rows…" value="${esc(state.search)}" />
    <span style="flex:1;"></span>
  `;
  $("#search-box").addEventListener("input", (e) => {
    state.search = e.target.value;
    renderTable();
  });
  const sheet = document.getElementById("sheet-filter");
  if (sheet) sheet.addEventListener("change", (e) => {
    state.sheet = e.target.value;
    renderTable();
  });
}

function renderTable() {
  const v = state.view;
  if (!v) return;
  const sheet = state.sheet;
  const q = state.search.trim().toLowerCase();
  const filtered = v.rows.filter((r) => {
    if (sheet && sheet !== "All" && r.sheet && r.sheet !== sheet) return false;
    if (q) {
      const blob = r.blob || r.values.join(" ").toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
  $("#row-count").textContent = q || (sheet && sheet !== "All")
    ? `${filtered.length} / ${v.total} rows`
    : `${v.total} rows`;
  if (!filtered.length) {
    $("#viewer-body").innerHTML = `<div class="empty">No rows match the current filters.</div>`;
    return;
  }
  const cols = v.columns || [];
  const tagColors = v.tag_colors || {};
  $("#viewer-body").innerHTML = `
    <table class="rows">
      <thead><tr>${cols.map((c) => `<th>${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>
        ${filtered.slice(0, 1000).map((r) => {
          const tagColor = tagColors[r.tag] || "";
          const rowStyle = tagColor ? `style="background-color:${tagColor};"` : "";
          return `<tr ${rowStyle} data-tag="${esc(r.tag)}">
            ${r.values.map((v) => `<td>${esc(v)}</td>`).join("")}
          </tr>`;
        }).join("")}
      </tbody>
    </table>
    ${filtered.length > 1000 ? `<div style="padding:10px;text-align:center;color:var(--text-muted);font-size:11px;">Showing first 1000 of ${filtered.length} matching rows · refine the filter to see specific rows</div>` : ""}
  `;
}

async function onDedupe() {
  toast("🔎 Scanning Snapshots workbook for duplicates…");
  const dry = await pywebview.api.dedupe_snapshots_workbook(null, true);
  if (!dry?.ok) { toast(`Dedupe scan failed: ${dry?.error || "?"}`, "error"); return; }
  const groups = dry.groups || [];
  if (!groups.length) { toast("✓ No duplicates found.", "ok"); return; }
  const sample = groups.slice(0, 5).map((g) => g.canonical).join(", ");
  if (!confirm(`Found ${groups.length} duplicate groups (${dry.rows_removed} rows to remove)\n\nFirst: ${sample}\n\nApply merge now?`)) return;
  toast("🧹 Merging duplicates…");
  const wet = await pywebview.api.dedupe_snapshots_workbook(null, false);
  if (!wet?.ok) { toast(`Dedupe apply failed: ${wet?.error || "?"}`, "error"); return; }
  toast(`✓ Merged ${wet.groups.length} groups · ${wet.rows_removed} rows removed`, "ok");
  if (state.active === "snapshots") await openWorkbook("snapshots");
}
async function onRecon() {
  toast("🔄 Reconciling with Trello (background)…");
  const r = await pywebview.api.reconcile_snapshots_with_trello();
  if (!r?.started) toast(`Couldn't start: ${r?.reason || "?"}`, "error");
}
async function onNotes() {
  toast("📝 Building daily notes Markdown…");
  const r = await pywebview.api.generate_daily_audit_md();
  toast(r?.ok ? `✓ Notes saved: ${r.path}` : `Failed: ${r?.error || "?"}`,
        r?.ok ? "ok" : "error");
}

// ── ➕ Add custom workbook (mirrors Tk spreadsheet_gui.py:325) ───
async function onAddWorkbook() {
  toast("📂 Pick a workbook…");
  const pick = await pywebview.api.pick_workbook_file();
  if (pick?.canceled) { toast(""); return; }
  if (!pick?.ok) { toast(`Couldn't read: ${pick?.error || "?"}`, "error"); return; }
  openConfirmAddWorkbook(pick.path, pick.info, pick.default_label);
}

function openConfirmAddWorkbook(path, info, defaultLabel) {
  const sheets = info?.sheets || [];
  if (!sheets.length) { toast("Empty workbook — no sheets found", "error"); return; }
  const details = info.details || {};
  const initSheet = sheets[0];
  const initHdrRow = (details[initSheet] || {}).header_row || 1;

  const w = document.createElement("div");
  w.id = "wb-add-modal";
  w.style.cssText = "position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;";
  w.innerHTML = `
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;width:min(560px,92vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;">
      <header style="padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);">
        <div style="font-size:15px;font-weight:600;">➕ Add a workbook</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;word-break:break-all;">${esc(path)}</div>
      </header>
      <div style="padding:18px 20px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;">
        <label style="display:flex;flex-direction:column;gap:4px;">
          <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Label (shown in sidebar)</span>
          <input id="wb-label" type="text" value="${esc(defaultLabel || "")}" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font:inherit;" />
        </label>
        <label style="display:flex;flex-direction:column;gap:4px;">
          <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Sheet</span>
          <select id="wb-sheet" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font:inherit;">
            ${sheets.map((s) => `<option value="${esc(s)}" ${s === initSheet ? "selected" : ""}>${esc(s)}</option>`).join("")}
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:4px;">
          <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);">Header row (1-based)</span>
          <input id="wb-hdr" type="number" min="1" max="20" value="${initHdrRow}" style="background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;width:90px;font:inherit;" />
        </label>
        <div id="wb-preview" style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--text-muted);"></div>
      </div>
      <footer style="padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn" id="wb-cancel">Cancel</button>
        <button class="btn btn-primary" id="wb-save">💾 Save</button>
      </footer>
    </div>`;
  document.body.appendChild(w);

  function refreshPreview() {
    const sh = $("#wb-sheet").value;
    const det = details[sh] || {};
    const hr = parseInt($("#wb-hdr").value, 10) || 1;
    const headers = (hr === det.header_row) ? (det.headers || []) : null;
    const dataRows = det.data_rows || 0;
    const show = (heads) => {
      const non = (heads || []).filter(Boolean);
      const shown = non.slice(0, 6).join(", ") || "(none detected)";
      const tail = non.length > 6 ? `, … (+${non.length - 6} more)` : "";
      $("#wb-preview").textContent =
        `Detected ${non.length} column(s): ${shown}${tail}\n~${dataRows} data row(s) below the header.`;
    };
    if (headers !== null) { show(headers); return; }
    // Re-inspect inline when user changes header row away from auto
    pywebview.api.inspect_workbook_at(path).then((info2) => {
      const det2 = (info2?.details || {})[sh] || {};
      show(det2.headers || []);
    });
  }
  $("#wb-sheet").addEventListener("change", () => {
    const sh = $("#wb-sheet").value;
    const det = details[sh] || {};
    $("#wb-hdr").value = det.header_row || 1;
    refreshPreview();
  });
  $("#wb-hdr").addEventListener("input", refreshPreview);
  refreshPreview();

  const close = () => w.remove();
  $("#wb-cancel").addEventListener("click", close);
  w.addEventListener("click", (e) => { if (e.target === w) close(); });

  $("#wb-save").addEventListener("click", async () => {
    const label = $("#wb-label").value.trim() || defaultLabel;
    const sheet = $("#wb-sheet").value;
    const hdr = parseInt($("#wb-hdr").value, 10) || 1;
    const btn = $("#wb-save");
    btn.disabled = true; btn.textContent = "Saving…";
    const res = await pywebview.api.add_workbook(label, path, sheet, hdr);
    if (!res?.ok) {
      toast(`Save failed: ${res?.error || "?"}`, "error");
      btn.disabled = false; btn.textContent = "💾 Save";
      return;
    }
    toast(`💾 Added "${label}"`, "ok");
    close();
    // Refresh sidebar + jump to the new workbook
    state.workbooks = await pywebview.api.workbooks() || [];
    renderList();
    if (res.key) await openWorkbook(res.key);
  });
  $("#wb-label").focus();
}
</script>
</body>
</html>
