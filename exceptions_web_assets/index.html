<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Exceptions — Linguar Hub</title>
  <script src="../web_shared/appearance.js?v=20260901a"></script>
  <link rel="stylesheet" href="../web_shared/theme.css?v=20260901a">
  <link rel="stylesheet" href="app.css?v=20260825a">
  <script src="../web_shared/iframe_shim.js"></script>
  <script src="../web_shared/usage_track.js?v=20260825a"></script>
  <script src="../web_shared/progress_bar.js?v=20260820a"></script>
<meta name="theme-color" content="#1A1A1A" />
<link rel="stylesheet" href="../web_shared/responsive.css?v=20260828a" />
</head>
<body class="responsive-ui">
  <header class="topbar">
    <div><div class="eyebrow">Daily triage</div><h1>Exceptions</h1></div>
    <div class="topbar-actions">
      <input id="filter" class="search" type="search" placeholder="Filter exceptions" aria-label="Filter exceptions">
      <button id="refresh" class="btn" data-track="exceptions_refresh">Refresh</button>
    </div>
  </header>
  <div id="freshness" class="freshness" role="status">Loading the latest checks…</div>
  <main>
    <aside aria-label="Exception categories">
      <div class="queue-heading"><span>Queue</span><strong id="total">—</strong></div>
      <div id="categories" class="categories"></div>
    </aside>
    <section class="detail" aria-live="polite">
      <div class="detail-heading">
        <div><div class="eyebrow" id="detail-priority">Select a category</div><h2 id="detail-title">What needs attention</h2></div>
        <span class="count" id="detail-count">0</span>
      </div>
      <div id="items" class="items"><div class="empty">Choose a category to review its items.</div></div>
      <button id="more" class="btn more hidden" data-track="exceptions_load_more">Load more</button>
    </section>
  </main>
  <footer class="statusbar"><span id="status">Ready</span><span>Corrections stay in their original tools</span></footer>
  <script src="app.js?v=20260825a"></script>
</body>
</html>
