<body class="responsive-ui">
<header class="topbar">
  <div class="brand">
    <span class="brand-name">📚 Resources</span>
  </div>
  <div class="topbar-actions">
    <input id="q" class="search" type="search" autofocus
           placeholder="🔎 Search forms, COIs, vendors, templates…" />
    <select id="ext" class="search" title="File type">
      <option value="">Any type</option>
      <option value="pdf">PDF</option>
      <option value="docx">Word</option>
      <option value="xlsx">Excel</option>
      <option value="jpg">JPG</option>
      <option value="png">PNG</option>
    </select>
    <button id="rebuild" class="btn" title="Re-walk the share. Takes about a minute.">↻ Rebuild</button>
  </div>
</header>

<main class="split">
  <aside class="areas">
    <div class="areas-head">Areas</div>
    <nav id="areas"></nav>
  </aside>
  <section class="results">
    <div id="hint" class="hint"></div>
    <div id="rows"></div>
  </section>
</main>

<footer class="statusbar"><span id="status"></span></footer>
<script src="app.js?v=20260814b"></script>
