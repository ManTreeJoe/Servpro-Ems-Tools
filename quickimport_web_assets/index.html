<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quick Import</title>
<link rel="stylesheet" href="theme.css" />
<style>
  body { margin: 0; font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 20px 60px; }
  header.hd { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  header.hd h1 { font-size: 22px; margin: 0; }
  .dept { font-size: 11px; color: var(--text-muted); border: 1px solid var(--border);
          border-radius: 20px; padding: 2px 10px; }
  #search { width: 100%; font-size: 18px; padding: 13px 16px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
            box-sizing: border-box; }
  #search:focus { outline: 2px solid var(--accent, #4A9EFF); border-color: transparent; }
  .hint { color: var(--text-muted); font-size: 12px; margin: 8px 2px; }
  #results { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .job { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
         border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
         font-size: 15px; }
  .job:hover { border-color: var(--accent, #4A9EFF); background: var(--surface-2); }
  .job .nm { flex: 1; font-weight: 600; }
  .job .tag { font-size: 10px; color: var(--text-muted); border: 1px solid var(--border);
              border-radius: 5px; padding: 1px 7px; }
  .job.nofolder .nm { color: var(--text-muted); }

  #panel { margin-top: 14px; }
  .selhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px;
             background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
             margin-bottom: 12px; }
  .selhead .big { font-size: 19px; font-weight: 700; flex: 1; }
  .selhead .path { font-size: 11px; color: var(--text-muted); font-family: monospace; }
  #back { font-size: 13px; }
  .grp { margin: 14px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .05em;
         text-transform: uppercase; color: var(--text-muted); }
  .btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .bigbtn { display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 15px 12px; font-size: 15px; font-weight: 600; border-radius: 10px;
            border: 1px solid var(--border); background: var(--surface); color: var(--text);
            cursor: pointer; }
  .bigbtn:hover:not(:disabled) { border-color: var(--accent, #4A9EFF); background: var(--surface-2); }
  .bigbtn:disabled { opacity: .4; cursor: not-allowed; }
  .bigbtn.primary { background: var(--accent, #2E8B57); color: #fff; border-color: transparent; font-size: 17px; }
  .copybtns .bigbtn { padding: 11px; font-size: 13px; }
  #status { margin-top: 16px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
            min-height: 18px; }
  #status.ok { background: rgba(46,139,87,.12); color: var(--green, #2E8B57); }
  #status.warn { background: rgba(230,160,30,.12); color: var(--amber, #d38b00); }
  #status.err { background: rgba(200,50,50,.12); color: var(--red, #c0392b); }
  .nofound { padding: 18px; border: 1px dashed var(--border); border-radius: 10px;
             text-align: center; color: var(--text-muted); }
  .nofound b { color: var(--text); }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hd">
      <h1>🚀 Quick Import</h1>
      <span class="dept" id="dept"></span>
    </header>

    <div id="searchview">
      <input id="search" type="text" placeholder="Type a job name (e.g. Martinez)…" autocomplete="off" autofocus />
      <div class="hint" id="hint">Search finds the job's folder. Pick one to import photos or copy its info.</div>
      <div id="results"></div>
    </div>

    <div id="panel" hidden></div>
    <div id="status"></div>
  </div>

  <script src="../web_shared/util.js?v=20260731j"></script>
<script src="../web_shared/progress_bar.js?v=20260813a"></script>
  <script src="../web_shared/modal.js?v=20260812a"></script>
<link rel="stylesheet" href="../web_shared/modal.css?v=20260813a" />
  <script src="../web_shared/toast_log.js?v=20260731j"></script>
  <script src="../web_shared/stage_picker.js?v=20260814a"></script>
  <script src="../web_shared/trello_attachments.js?v=20260731j"></script>
  <script src="../web_shared/trello_hover.js?v=20260812a"></script>
  <script src="../web_shared/audit_detail.js?v=20260814c"></script>
  <script src="app.js?v=20260811a"></script>
</body>
</html>
