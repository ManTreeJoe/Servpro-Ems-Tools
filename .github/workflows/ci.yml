name: Agent build and review checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      LINGUAR_CI: '1'
      ONELOSS_TRELLO_WRITES_ENABLED: 'false'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        id: deps
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          exit $LASTEXITCODE
      - name: Prepare unconfigured runner profile and build seed
        id: seed
        shell: python
        run: |
          import json, os, tempfile
          from pathlib import Path
          profile = tempfile.mkdtemp(prefix='oneloss-ci-')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for key in ('APPDATA', 'LOCALAPPDATA', 'USERPROFILE', 'HOME'):
                  out.write(f'{key}={profile}\n')
          # Deliberately no provider addresses, credentials or copied user config.
          seed = {'trello_token': '', 'companycam_api_token': '', 'appearance': 'system'}
          Path('_packaging/config.json').write_text(json.dumps(seed), encoding='utf-8')
      - name: Lint
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: python dev_lint.py
      - name: Typecheck root Python modules
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: python .github/agent_checks.py typecheck
      - name: Test CI contracts and skip policy
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          python .github/test_ci_policy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/test_agent_workflow.py
      - name: Python tests
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: python -m pytest tests/ -ra --junitxml=test-results/pytest.xml
      - name: Node and SQL tests
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: python .github/agent_checks.py node-tests
      - name: Build only (never launch or publish)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: python -m PyInstaller --noconfirm --distpath dist-ci --workpath build-ci Linguar_Hub.spec
      - name: Upload test evidence only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
