name: Windows tests and build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt pytest openpyxl==3.1.5 pypdf
      - name: Install Node test dependencies
        id: node-deps
        run: npm ci
      # All browser tests use the runner's installed Microsoft Edge.
      # The remaining eight top-level Node scripts do not launch a browser.
      - name: Generate unconfigured CI seed
        shell: python
        run: |
          import json
          import os
          import tempfile
          import sys
          from pathlib import Path
          os.environ["APPDATA"] = tempfile.mkdtemp(prefix="ci-seed-")
          os.environ["LOCALAPPDATA"] = os.environ["APPDATA"]
          sys.path.insert(0, str(Path.cwd()))
          from _packaging.make_shipped_config import build, audit
          seed, unknown = build({})
          assert not unknown and not audit(seed)
          assert seed == {"trello_token": "", "companycam_api_token": "", "appearance": "system"}
          Path("_packaging/config.json").write_text(json.dumps(seed), encoding="utf-8")
      - name: Validate CI skip policy
        run: python .github/test_ci_policy.py
      - name: Run pytest
        env:
          LINGUAR_CI: '1'
        run: python -m pytest tests/ -ra --junitxml=pytest-results.xml
      - name: Upload pytest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Run top-level Node scripts
        if: ${{ !cancelled() && steps.node-deps.outcome == 'success' }}
        shell: pwsh
        run: |
          $skipReasons = (Get-Content .github/ci-skips.json -Raw | ConvertFrom-Json -AsHashtable).node_scripts
          $passed = 0
          $skipped = 0
          $failed = @()
          foreach ($test in Get-ChildItem tests/*.cjs | Sort-Object Name) {
            if ($skipReasons.ContainsKey($test.Name)) {
              Write-Output "SKIP: $($test.Name); reason=$($skipReasons[$test.Name])"
              $skipped++
              continue
            }
            Write-Output "RUN: $($test.Name)"
            node $test.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $test.Name } else { $passed++ }
          }
          $summary = "Node scripts: $passed passed, $($failed.Count) failed, $skipped skipped"
          Write-Output $summary
          $summary >> $env:GITHUB_STEP_SUMMARY
          if ($failed.Count -gt 0) { throw "Failed scripts: $($failed -join ', ')" }
          exit 0

  build:
    name: Windows PyInstaller build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Generate unconfigured CI seed
        shell: python
        run: |
          import json
          import os
          import tempfile
          import sys
          from pathlib import Path
          os.environ["APPDATA"] = tempfile.mkdtemp(prefix="ci-seed-")
          os.environ["LOCALAPPDATA"] = os.environ["APPDATA"]
          sys.path.insert(0, str(Path.cwd()))
          from _packaging.make_shipped_config import build, audit
          seed, unknown = build({})
          assert not unknown and not audit(seed)
          assert seed == {"trello_token": "", "companycam_api_token": "", "appearance": "system"}
          Path("_packaging/config.json").write_text(json.dumps(seed), encoding="utf-8")
      - name: Build Linguar Hub
        run: pyinstaller --noconfirm Linguar_Hub.spec
      - name: Verify the complete application folder
        id: package
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if (!(Test-Path 'dist/Linguar Hub/Linguar Hub.exe')) { throw 'Missing executable' }
          if (!(Test-Path 'dist/Linguar Hub/_internal' -PathType Container)) { throw 'Missing _internal folder' }
          Copy-Item README.txt 'dist/Linguar Hub/README.txt'
          $branch = $env:SOURCE_BRANCH -replace '[^a-zA-Z0-9._-]', '-'
          $sha = (git rev-parse --short=7 HEAD).Trim()
          $name = "Linguar-Hub-$branch-$sha"
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/Linguar Hub
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  trial-release:
    name: Trial installer
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Generate unconfigured CI seed
        shell: python
        run: |
          import json
          import os
          import tempfile
          import sys
          from pathlib import Path
          os.environ["APPDATA"] = tempfile.mkdtemp(prefix="ci-seed-")
          os.environ["LOCALAPPDATA"] = os.environ["APPDATA"]
          sys.path.insert(0, str(Path.cwd()))
          from _packaging.make_shipped_config import build, audit
          seed, unknown = build({})
          assert not unknown and not audit(seed)
          assert seed == {"trello_token": "", "companycam_api_token": "", "appearance": "system"}
          Path("_packaging/config.json").write_text(json.dumps(seed), encoding="utf-8")
      - name: Build Trial edition
        shell: pwsh
        run: |
          $env:LINGUAR_APP_NAME = "Linguar Hub Trial"
          pyinstaller --noconfirm Linguar_Hub.spec
      - name: Verify and package Trial installer
        id: trial-package
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $app = 'dist/Linguar Hub Trial'
          if (!(Test-Path "$app/Linguar Hub Trial.exe")) { throw 'Missing Trial executable' }
          if (!(Test-Path "$app/_internal" -PathType Container)) { throw 'Missing Trial _internal folder' }
          Copy-Item README.txt "$app/README.txt"
          $manifest = Get-Content version.txt -Raw | ConvertFrom-Json
          $version = "$($manifest.version)-trial.$env:RUN_NUMBER"
          # Stamp only the packaged copy; keep the source version.txt and spec intact.
          $manifest.version = $version
          $manifest | ConvertTo-Json | Set-Content "$app/_internal/version.txt" -Encoding utf8NoBOM
          $iscc = Get-ChildItem 'C:/Program Files*/Inno Setup */ISCC.exe' | Select-Object -First 1
          if (!$iscc) { throw 'Inno Setup compiler ISCC.exe is missing from the Windows runner' }
          $source = (Resolve-Path $app).Path
          & $iscc.FullName /DTrial "/DMyAppVersion=$version" "/DSourceDir=$source" Linguar_Hub.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $installer = "Output/Linguar-Hub-Trial-Setup-$version.exe"
          if (!(Test-Path $installer -PathType Leaf)) { throw "Missing installer: $installer" }
          "Installer output: $((Resolve-Path $installer).Path)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload Trial installer
        uses: actions/upload-artifact@v4
        with:
          name: Linguar-Hub-Trial-Setup-${{ steps.trial-package.outputs.version }}
          path: ${{ steps.trial-package.outputs.installer }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish verified Trial prerelease and feed
        if: ${{ env.RELEASES_REPO_TOKEN != '' }}
        shell: pwsh
        env:
          TRIAL_VERSION: ${{ steps.trial-package.outputs.version }}
          TRIAL_INSTALLER: ${{ steps.trial-package.outputs.installer }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          "Trial test build $env:TRIAL_VERSION" | Set-Content trial-notes.txt -Encoding utf8NoBOM
          python tools/publish_desktop_release.py trial --version "$env:TRIAL_VERSION" --commit "$env:SOURCE_COMMIT" --installer "$env:TRIAL_INSTALLER" --notes trial-notes.txt
      - name: Skip publishing without releases token
        if: ${{ env.RELEASES_REPO_TOKEN == '' }}
        shell: pwsh
        run: |
          "Skipping publish, secret not configured: RELEASES_REPO_TOKEN. The Trial installer is available in this run's artifacts." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
