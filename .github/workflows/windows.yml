name: Windows tests and build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Install Node test dependencies
        id: node-deps
        run: npm ci
      # All browser tests use the runner's installed Microsoft Edge.
      # The remaining eight top-level Node scripts do not launch a browser.
      - name: Run pytest
        run: python -m pytest tests/ -ra --junitxml=pytest-results.xml
      - name: Run top-level Node scripts
        if: ${{ !cancelled() && steps.node-deps.outcome == 'success' }}
        shell: pwsh
        run: |
          $passed = 0
          $skipped = 0
          $failed = @()
          foreach ($test in Get-ChildItem tests/*.cjs | Sort-Object Name) {
            if ($test.Name -eq 'shell_startup_styles.cjs') {
              Write-Output "SKIP: $($test.Name); reason=requires DEV_TEST_URL and a live dev server; CI provides neither"
              $skipped++
              continue
            }
            Write-Output "RUN: $($test.Name)"
            node $test.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $test.Name } else { $passed++ }
          }
          $summary = "Node scripts: $passed passed, $($failed.Count) failed, $skipped skipped"
          Write-Output $summary
          $summary >> $env:GITHUB_STEP_SUMMARY
          if ($failed.Count -gt 0) { throw "Failed scripts: $($failed -join ', ')" }
          exit 0
      - name: Upload pytest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Windows PyInstaller build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Linguar Hub
        run: pyinstaller --noconfirm Linguar_Hub.spec
      - name: Verify and zip the complete application folder
        id: package
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if (!(Test-Path 'dist/Linguar Hub/Linguar Hub.exe')) { throw 'Missing executable' }
          if (!(Test-Path 'dist/Linguar Hub/_internal' -PathType Container)) { throw 'Missing _internal folder' }
          Copy-Item README.txt 'dist/Linguar Hub/README.txt'
          $branch = $env:SOURCE_BRANCH -replace '[^a-zA-Z0-9._-]', '-'
          $sha = (git rev-parse --short=7 HEAD).Trim()
          $name = "Linguar-Hub-$branch-$sha"
          Compress-Archive -Path 'dist/Linguar Hub' -DestinationPath "$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
