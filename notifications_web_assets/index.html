<title>Notifications — OneLoss</title>

<link rel="stylesheet" href="theme.css?v=20260903a" />
<style>
  .comment-markdown,.notif-snippet { overflow-wrap:anywhere; line-height:1.5; }
  .comment-markdown p,.notif-snippet p { margin:0 0 8px; }
  .comment-markdown > :last-child,.notif-snippet > :last-child { margin-bottom:0; }
  .comment-markdown ul,.comment-markdown ol,.notif-snippet ul,.notif-snippet ol { padding-left:20px; margin:6px 0; }
  .comment-markdown blockquote,.notif-snippet blockquote { margin:8px 0; padding-left:10px; border-left:2px solid var(--border); }
  .comment-markdown a,.notif-snippet a { color:var(--text); text-decoration:underline; }
  .comment-markdown pre { white-space:pre-wrap; }
  .comment-markdown h1,.comment-markdown h2,.comment-markdown h3 { font-size:inherit; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .unread-pill {
    background: var(--red); color: #fff; font-weight: 700; font-size: 11px;
    padding: 2px 9px; border-radius: 999px; min-width: 18px; text-align: center;
  }
  .unread-pill.zero { background: var(--surface-3); color: var(--text-muted); }
  .content { flex: 1; overflow-y: auto; padding: 14px 18px 40px; }
  .board-group { margin-bottom: 18px; }
  .board-head {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  .board-head .caret { color: var(--text-dim); width: 12px; transition: transform 120ms ease; }
  .board-group.collapsed .caret { transform: rotate(-90deg); }
  .board-name { font-weight: 700; font-size: 14px; }
  .board-count { font-size: 11px; color: var(--text-muted); }
  .board-group.collapsed .notif-list { display: none; }
  .notif-list { list-style: none; margin: 0; padding: 0; }
  .notif {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 12px; align-items: start;
    padding: 11px 10px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 90ms ease;
  }
  .notif:hover { background: var(--row-hover); }
  .notif.unread { background: var(--row-active); }
  .notif.read { opacity: 0.72; }
  .notif-icon { font-size: 16px; line-height: 1.4; position: relative; }
  .notif.unread .notif-icon::after {
    content: ""; position: absolute; top: -1px; right: -5px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--red);
  }
  .notif-body { min-width: 0; }
  .notif-card { font-weight: 600; font-size: 13px; }
  .notif-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .notif-snippet {
    font-size: 12px; color: var(--text); margin-top: 4px;
    background: var(--surface-2); border-radius: 5px; padding: 6px 9px;
    white-space: pre-wrap; word-break: break-word;
  }
  .notif-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .notif-date { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .mark-btn {
    background: var(--surface-2); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 9px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .mark-btn:hover { background: var(--green); color: #fff; border-color: var(--green); }
  .empty { text-align: center; color: var(--text-muted); padding: 60px 20px; }
  .empty .big { font-size: 34px; display: block; margin-bottom: 10px; }
  .toggle {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--text-muted); cursor: pointer; user-select: none;
  }
</style>
<meta name="theme-color" content="#1A1A1A" />
<link rel="stylesheet" href="../web_shared/workspace_controls.css?v=20260910a" />

<body class="responsive-ui">
<details class="desktop-alert-settings">
  <summary>Windows notifications</summary>
  <div class="desktop-alert-controls">
    <label>Desktop alerts <select id="desktop-alert-mode" disabled><option value="off">Off</option><option value="mentions">Mentions only</option><option value="jobs">Mentions and my job comments</option></select></label>
    <label>Sound <select id="desktop-alert-sound" aria-label="Sound" disabled><option value="chime">Message chime</option><option value="system">Windows default</option><option value="silent">Silent</option></select></label>
    <button class="btn" id="desktop-alert-test" disabled>Send test notification</button>
    <span id="desktop-alert-status" role="status"></span>
  </div>
  <p>Keep the app running or minimized to receive alerts. Windows controls notification volume and Do not disturb. Bursts play at most one sound every five seconds.</p>
</details>
<link rel="stylesheet" href="desktop.css?v=20261001">
<script src="desktop.js?v=20261020sound"></script>
<header class="topbar">
  <div class="brand">
    <span class="brand-name">Notifications</span>
    <span id="unread-pill" class="unread-pill zero">0</span>
  </div>
  <div class="topbar-actions">
    <div class="notification-views" role="group" aria-label="Notification view">
      <button type="button" data-notification-view="all" aria-pressed="true">All</button>
      <button type="button" data-notification-view="mentions" aria-pressed="false">Mentions</button>
    </div>
    <details class="notification-board-picker">
      <summary id="notification-board-summary">All boards</summary>
      <div id="notification-board-options" aria-label="Boards"></div>
    </details>
    <label class="toggle"><input type="checkbox" id="unread-only" /> Only show unread</label>
    <button id="mark-all-btn" class="btn">Mark shown read</button>
    <button id="clear-all-btn" class="btn" title="Mark all Trello and OneLoss notifications read, including those not shown">Mark all read</button>
    <button id="refresh-btn" class="btn">↻ Refresh</button>
  </div>
</header>
<div class="status-bar" style="padding:6px 18px;font-size:12px;color:var(--text-muted);border-bottom:1px solid var(--border);">
  <span id="status-msg"></span>
  <span> · Open a comment to view its card. Show more keeps it unread.</span>
</div>
<main class="content" id="feed">
  <div class="empty"><span class="big">🔔</span>Loading notifications…</div>
</main>

<style>
#feed{flex:1;min-height:0;overflow:auto}.topbar,.status-bar,.desktop-alert-settings{flex-shrink:0}
.comment-reactions .text-btn{background:transparent;border:0;color:var(--text-muted);padding:4px 0;cursor:pointer;font:inherit;font-size:12px}
#notification-board{max-width:210px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:5px}
.responsive-ui .topbar{flex-wrap:wrap;overflow:visible}.responsive-ui .topbar .brand{display:flex!important}
.responsive-ui .topbar-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.topbar-actions>*{flex-shrink:0}.notification-types summary{white-space:nowrap}
.notif-list{padding:0;list-style:none}.notif-meta{font-size:12px}
