<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Initial Upload Queue — EMS Tools</title>
<link rel="stylesheet" href="theme.css" />
<script src="iframe_shim.js"></script>
<script src="../web_shared/util.js"></script>
<script src="../web_shared/modal.js"></script>
<script src="../web_shared/ctx_menu.js"></script>
<script src="../web_shared/open_in.js"></script>
<script src="../web_shared/trello_hover.js"></script>
<script src="../web_shared/trello_attachments.js"></script>
<script src="../web_shared/stage_picker.js"></script>
<script src="../web_shared/keyboard.js"></script>
<script src="../web_shared/toast_log.js"></script>
<link rel="stylesheet" href="../audit_web_assets/app.css" />
<style>
  /* Subtle overrides on top of the audit two-pane CSS we're reusing */
  .lane-pill {
    background: var(--chip-bg);
    color: var(--text);
    padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .lane-pill[data-lane*="Initial" i]  { background: var(--act-initial); color: #FFFFFF; }
  .lane-pill[data-lane*="Monitor" i]  { background: var(--act-monitor); color: #FFFFFF; }
  .lane-pill[data-lane*="Pending" i]  { background: var(--amber);       color: #FFFFFF; }
  .lane-pill[data-lane*="WORK IN PROGRESS" i] { background: var(--green); color: #FFFFFF; }
  .progress {
    display: inline-block;
    padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 700;
    background: var(--surface-2); color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .progress.done { background: var(--green); color: #FFFFFF; }
  .progress.partial { background: var(--amber); color: #FFFFFF; }
  .checklist {
    list-style: none; padding: 0; margin: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .checklist li {
    padding: 9px 14px; font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .checklist li:last-child { border-bottom: none; }
  .checklist li.done { color: var(--text-muted); text-decoration: line-through; }
  .checklist li::before { content: none; }
  .checklist .cl-toggle {
    display: inline-block; width: 18px; height: 18px;
    border-radius: 3px; border: 2px solid var(--text-dim);
    flex-shrink: 0; cursor: pointer;
    transition: all 100ms ease;
  }
  .checklist .cl-toggle:hover { border-color: var(--green); }
  .checklist li.done .cl-toggle {
    background: var(--green); border-color: var(--green);
    color: #FFFFFF; text-align: center; line-height: 14px;
    font-weight: 700; font-size: 12px;
  }
  .checklist li.done .cl-toggle::before { content: "✓"; color: #FFFFFF; }
  .checklist .cl-name { flex: 1; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">SERVPRO · Initial Upload Queue</span>
    <span class="brand-tag">web · phase 1</span>
  </div>
  <div class="topbar-actions">
    <input id="search-box" class="search" type="search" placeholder="🔎 Search…" />
    <button id="add-manual-btn" class="btn">＋ Add manual row</button>
    <button id="refresh-btn" class="btn btn-primary">↻ Refresh from Trello</button>
  </div>
</header>

<nav class="filter-bar" id="lane-chips"></nav>

<main class="split">
  <aside class="list-pane">
    <header class="pane-head"><span id="list-count">— cards</span></header>
    <div class="list-body" id="list-body" tabindex="0"></div>
  </aside>
  <section class="detail-pane">
    <div id="detail-empty" class="empty-state">
      <div class="empty-emoji">📥</div>
      <div class="empty-title">Pick a card from the list</div>
      <div class="empty-sub">↻ Refresh to pull from Trello</div>
    </div>
    <article id="detail-view" class="detail-view hidden"></article>
  </section>
</main>

<div id="loading-state" class="loading-state hidden">
  <div class="spinner"></div>
  <div class="loading-label">Pulling from Trello…</div>
</div>

<footer class="statusbar">
  <span id="status-counts">—</span>
  <span id="status-msg" class="status-msg"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
