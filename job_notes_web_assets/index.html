<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../web_shared/usage_track.js?v=20260825a"></script>
<meta charset="UTF-8" />
<title>Job Notes — Linguar Hub</title>
<script src="../web_shared/appearance.js?v=20260901a"></script>
<link rel="stylesheet" href="../web_shared/theme.css?v=20260901a" />
<link rel="stylesheet" href="theme.css" />
<script src="../web_shared/health_banner.js?v=20260820a"></script>
<script src="../web_shared/progress_bar.js?v=20260818a"></script>
<script src="../web_shared/iframe_shim.js?v=20260818b"></script>
<script src="../web_shared/panel_state.js?v=20260811a"></script>
<script src="../web_shared/util.js?v=20260731j"></script>
<script src="../web_shared/trello_hover.js?v=20260812a"></script>
<script src="../web_shared/keyboard.js?v=20260812a"></script>
<script src="../web_shared/toast_log.js?v=20260731j"></script>
<link rel="stylesheet" href="app.css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1A1A1A" />
<link rel="stylesheet" href="../web_shared/responsive.css?v=20260828a" />
</head>
<body class="responsive-ui">
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">SERVPRO · Job Notes</span>
    <span class="brand-tag">web</span>
  </div>
  <div class="topbar-actions">
    <input id="search-box" class="search" type="search" placeholder="🔎 Search notes…" />
    <button id="compose-btn" class="btn btn-primary">✏ New / edit note</button>
    <button id="open-folder-btn" class="btn">📁 Notes folder</button>
    <button id="refresh-btn" class="btn">↻ Refresh</button>
  </div>
</header>

<main class="split">
  <aside class="list-pane">
    <header class="pane-head"><span id="list-count">— notes</span></header>
    <div class="list-body" id="list-body"></div>
  </aside>
  <section class="detail-pane">
    <div id="detail-empty" class="empty"><div class="empty-emoji">📝</div><div>Pick a note from the list.</div></div>
    <article id="detail" class="detail hidden"></article>
  </section>
</main>

<footer class="statusbar">
  <span id="status-counts">—</span>
  <span id="status-msg" class="status-msg"></span>
</footer>
<script src="app.js?v=20260812a"></script>
</body>
</html>
