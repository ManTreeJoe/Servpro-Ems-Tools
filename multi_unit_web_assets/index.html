<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Multi-Unit — EMS Tools</title>
<link rel="stylesheet" href="theme.css" />
<script src="../web_shared/iframe_shim.js"></script>
<script src="../web_shared/util.js"></script>
<style>
  .wrap { flex: 1; overflow-y: auto; padding: 18px 24px; max-width: 1000px; margin: 0 auto; width: 100%; }
  .group { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
  .group h3 { margin: 0 0 8px; font-size: 14px; }
  .unit { padding: 6px 0; border-bottom: 1px dotted var(--border); font-size: 13px;
          display: flex; align-items: center; gap: 10px; }
  .unit:last-child { border-bottom: none; }
  .unit .label { flex: 1; }
  .unit .open-btn {
    background: var(--surface-2); color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 8px; cursor: pointer; font: inherit; font-size: 11px;
  }
  .unit .open-btn:hover { background: var(--border); color: var(--text); }
  .group-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .group-head h3 { margin: 0; font-size: 14px; }
  .empty { padding: 40px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark"></span>
    <span class="brand-name">SERVPRO · Multi-Unit</span>
    <span class="brand-tag">web · viewer</span>
  </div>
  <div class="topbar-actions">
    <button id="cleanup-btn" class="btn" title="Find + rename unit subfolders that don't follow the canonical convention">🧹 Cleanup unit folders…</button>
  </div>
</header>
<main class="wrap" id="wrap"></main>
<script>
window.addEventListener("pywebviewready", async () => {
  const groups = await pywebview.api.list_groups() || [];
  const wrap = document.getElementById("wrap");
  if (!groups.length) {
    wrap.innerHTML = `<div class="empty">No multi-unit groups recorded yet.</div>`;
    return;
  }
  wrap.innerHTML = groups.map((g) => {
    const units = g.units || [];
    const yr = g.year ? `<span style="color:var(--text-muted);font-size:11px;font-weight:400;margin-left:6px;">${esc(g.year)}</span>` : "";
    return `
    <div class="group">
      <div class="group-head">
        <h3>🏢 ${esc(g.parent_canon || g.name || "?")}${yr}
          <span style="color:var(--text-muted);font-size:11px;font-weight:400;">· ${units.length} sub-job${units.length !== 1 ? "s" : ""}</span></h3>
        <button class="open-btn" data-parent="${esc(g.path)}">📁 Open parent folder</button>
      </div>
      <div>${units.map((u) => {
        // Numbered units show "Unit N — name"; named sub-jobs (school /
        // site / date folders) just show their name.
        const label = (u.kind === "unit" && u.unit_number !== "")
          ? `Unit ${esc(u.unit_number)} — ${esc(u.name)}`
          : esc(u.name);
        return `
        <div class="unit">
          <span class="label">${u.kind === "job" ? "📄 " : "🏠 "}${label}</span>
          <button class="open-btn" data-path="${esc(u.path)}">📁 Open</button>
        </div>`; }).join("")}</div>
    </div>`; }).join("");
  document.querySelectorAll(".unit .open-btn[data-path]").forEach((b) =>
    b.addEventListener("click", () =>
      pywebview.api.open_subjob_folder(b.dataset.path)));
  document.querySelectorAll(".group-head .open-btn").forEach((b) =>
    b.addEventListener("click", () =>
      pywebview.api.open_parent_folder(b.dataset.parent)));
  document.getElementById("cleanup-btn")?.addEventListener("click", openCleanupModal);
});

async function openCleanupModal() {
  const w = document.createElement("div");
  w.id = "mu-cleanup";
  w.style.cssText = "position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;";
  w.innerHTML = `
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;width:min(720px,94vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;">
      <header style="padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--border);">
        <div style="font-size:15px;font-weight:600;">🧹 Multi-unit folder cleanup</div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">Dry-run preview · select renames to apply</div>
      </header>
      <div id="mu-body" style="padding:18px 20px;overflow-y:auto;max-height:60vh;">
        <div style="text-align:center;color:var(--text-muted);">Scanning multi-unit properties…</div>
      </div>
      <footer style="padding:12px 20px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn" id="mu-cancel">Cancel</button>
        <span style="flex:1;"></span>
        <button class="btn btn-primary" id="mu-apply" disabled>🧹 Apply renames</button>
      </footer>
    </div>`;
  document.body.appendChild(w);
  const close = () => w.remove();
  document.getElementById("mu-cancel").addEventListener("click", close);
  w.addEventListener("click", (e) => { if (e.target === w) close(); });

  const res = await pywebview.api.cleanup_dry_run();
  if (!res?.ok) {
    document.getElementById("mu-body").innerHTML =
      `<div style="color:var(--red);">Error: ${esc(res?.error || "?")}</div>`;
    return;
  }
  if (!res.total_renames) {
    document.getElementById("mu-body").innerHTML =
      `<div style="text-align:center;color:var(--text-muted);">✓ Nothing to rename — every unit folder follows the convention.</div>`;
    return;
  }
  document.getElementById("mu-body").innerHTML = `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">
      ${res.total_renames} rename${res.total_renames !== 1 ? "s" : ""} across ${res.properties.length} ${res.properties.length === 1 ? "property" : "properties"}
    </div>
    ${res.properties.map((p) => `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:10px;">
        <div style="font-weight:600;margin-bottom:6px;">🏢 ${esc(p.property)}</div>
        ${p.renames.map((r) => `
          <label style="display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;padding:4px 0;font-size:12px;cursor:pointer;">
            <input type="checkbox" class="mu-pick" data-src="${esc(r.src)}" data-dst="${esc(r.dst)}" checked />
            <span style="color:var(--text-muted);">${esc(r.name)}</span>
            <span style="color:var(--text-dim);">→</span>
            <span style="color:var(--text);font-weight:500;">${esc(r.new_name)}</span>
          </label>`).join("")}
      </div>`).join("")}
  `;
  document.getElementById("mu-apply").disabled = false;
  document.getElementById("mu-apply").addEventListener("click", async () => {
    const pairs = Array.from(document.querySelectorAll(".mu-pick"))
      .filter((c) => c.checked)
      .map((c) => ({ src: c.dataset.src, dst: c.dataset.dst }));
    if (!pairs.length) return;
    if (!confirm(`Rename ${pairs.length} folder${pairs.length !== 1 ? "s" : ""}? This cannot be undone.`)) return;
    const btn = document.getElementById("mu-apply");
    btn.disabled = true; btn.textContent = "Renaming…";
    // Pass the exact {src,dst} pairs previewed so apply executes what was
    // shown, not a freshly re-proposed target (audit bug #3).
    const r = await pywebview.api.cleanup_apply(pairs);
    btn.disabled = false; btn.textContent = "🧹 Apply renames";
    if (!r?.ok) { alert(`Failed: ${r?.error || "?"}`); return; }
    close();
    alert(`✓ Renamed ${r.moved} folder${r.moved !== 1 ? "s" : ""}${r.errors.length ? ` (${r.errors.length} errors)` : ""}`);
    location.reload();
  });
}
function esc(s) { return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
</script>
</body>
</html>
