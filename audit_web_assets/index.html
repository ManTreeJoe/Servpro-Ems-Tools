<!DOCTYPE html>
<html lang="en">
<head>
<script src="../web_shared/iframe_shim.js?v=20260818b"></script>
<script src="../web_shared/panel_state.js?v=20260811a"></script>
<script src="../web_shared/util.js?v=20260731j"></script>
<script src="../web_shared/progress_bar.js?v=20260817a"></script>
<script src="../web_shared/modal.js?v=20260812a"></script>
<link rel="stylesheet" href="../web_shared/modal.css?v=20260813a" />
<script src="../web_shared/umbrella_group.js?v=20260731j"></script>
<script src="../web_shared/usage_track.js?v=20260731j"></script>
<script src="../web_shared/hygiene_board.js?v=20260731j"></script>
<script src="../web_shared/request_items.js?v=20260731j"></script>
<script src="../web_shared/xactimate_prep.js?v=20260731j"></script>
<script src="../web_shared/ctx_menu.js?v=20260731j"></script>
<script src="../web_shared/open_in.js?v=20260731j"></script>
<script src="../web_shared/trello_hover.js?v=20260812a"></script>
<script src="../web_shared/trello_attachments.js?v=20260731j"></script>
<script src="../web_shared/stage_picker.js?v=20260814a"></script>
<script src="../web_shared/keyboard.js?v=20260812a"></script>
<script src="../web_shared/keyboard_help.js?v=20260731j"></script>
<script src="../web_shared/undo_toast.js?v=20260731j"></script>
<script src="../web_shared/recent_jobs.js?v=20260731j"></script>
<script src="../web_shared/skeleton.js?v=20260731j"></script>
<script src="../web_shared/toast_log.js?v=20260731j"></script>
<link rel="stylesheet" href="../web_shared/skeleton.css" />
<link rel="stylesheet" href="../web_shared/umbrella_group.css?v=20260722a" />
<link rel="stylesheet" href="../web_shared/hygiene_board.css?v=20260723a" />
<link rel="stylesheet" href="../web_shared/xactimate_prep.css?v=20260723a" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit — Linguar Hub</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">SERVPRO · Daily Audit</span>
    <span class="brand-tag">web spike · two-pane</span>
  </div>
  <div class="topbar-actions">
    <!-- Positioned wrapper so the type-ahead list can anchor under the
         input instead of the whole toolbar row. -->
    <span id="search-wrap" style="position:relative;display:inline-block;">
      <input id="search-box" class="search" type="search"
             placeholder="🔎 Search client / form / tech…" autocomplete="off" />
    </span>
    <button id="clear-oneoff-btn" class="btn hidden"
            title="Clear the jobs you've pulled up by searching. Searched jobs stay on this tab so you can work several at once.">✕ Clear results</button>
    <button id="run-btn"      class="btn btn-primary" disabled title="Run the daily audit for today's run-doc (uses cached results where possible)">↻ Run Audit</button>
    <button id="new-loss-btn" class="btn" title="Create a new-loss Trello card from a carrier assignment email — paste it in, review the fields, done">🆕 New Loss</button>
    <button id="notes-btn" class="btn" title="Tracked to-do notes — tied to a job or loose">📝 Notes</button>
    <div id="more-wrap" style="position:relative;">
      <button id="more-btn" class="btn" title="More actions">⋯ More</button>
      <div id="more-menu"
           style="position:absolute;top:36px;right:0;
                  background:var(--surface);border:1px solid var(--border);
                  border-radius:6px;min-width:240px;
                  z-index:80;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);
                  overflow:hidden;">
        <button class="more-item" id="usage-btn">📊 Usage report</button>
        <button class="more-item" id="overview-btn">🩺 Overview</button>
        <button class="more-item" id="name-issues-btn"
                title="Jobs that look like one insured under two spellings — confirm they're the same, or keep them separate">🧩 Name issues…</button>
        <button class="more-item" id="rerun-btn">↺ Full re-scan (no cache)</button>
        <button class="more-item" id="push-new-losses-btn">📊 Push new losses → APA</button>
        <button class="more-item" id="post-daily-misses-btn">💬 Post daily misses → Trello</button>
        <button class="more-item" id="export-flagged-btn">📄 Export flagged → PDF</button>
        <button class="more-item" id="export-all-btn">📄 Export all → PDF</button>
        <button class="more-item" id="archive-month-btn">🗄 Archive month…</button>
        <button class="more-item" id="copy-xa-apology-btn"
                title="Copy the standard XA apology text to your clipboard so you can paste it into XactAnalysis for each job that needs it">🔔 Copy XA apology note</button>
      </div>
    </div>
  </div>
</header>
<style>
  .more-item {
    display: block; width: 100%; text-align: left;
    background: transparent; color: var(--text);
    border: none; padding: 9px 14px; cursor: pointer;
    font: inherit; font-size: 13px;
  }
  .more-item:hover { background: var(--row-hover); }
  .more-item + .more-item { border-top: 1px solid var(--border); }
</style>

<!-- Mode switcher + filters share a row. Both answer "which subset am I
     looking at", and stacking them cost a whole line of chrome above the
     list. Modes left, filters right. -->
<div class="audit-toolbar mode-row">
  <button class="mode-btn active" id="mode-search" title="Jobs you've pulled up this session, newest first. Search from the box above; ⭐ Starred keeps jobs across sessions.">🕘 Recent</button>
  <button class="mode-btn" id="mode-daily" title="Today's run-doc audit">📋 Daily Run</button>
  <button class="mode-btn" id="mode-starred" title="Clients you've starred — sticky across days, regardless of today's run-doc">⭐ Starred</button>
  <span class="spacer"></span>
  <nav class="filter-bar" id="filter-bar" aria-label="Filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="starred"
            title="Only clients you've ⭐ starred">⭐ Starred</button>
    <button class="filter" data-filter="new_loss">🆕 New loss</button>
  </nav>
</div>

<!-- Day walker + section toggles (Daily Run mode only) -->
<div class="audit-toolbar" id="daily-toolbar">
  <button class="btn" id="day-prev">⏮</button>
  <button class="btn" id="day-today">📅 Today</button>
  <button class="btn" id="day-next">⏭</button>
  <span class="audit-date-label" id="audit-date-label">—</span>
  <button class="btn" id="open-doc-btn">📄 Open run-doc</button>
  <span class="spacer"></span>
  <label class="sec-toggle">
    <input type="checkbox" id="sec-work" checked /> <span>🛠 Work</span>
  </label>
  <label class="sec-toggle">
    <input type="checkbox" id="sec-monitor" checked /> <span>📡 Monitor</span>
  </label>
</div>

<!-- The filter bar now shares the mode row above; see .mode-row. -->


<main class="split">
  <!-- Left pane: compact list of all jobs -->
  <aside class="list-pane">
    <header class="pane-head">
      <span id="list-count">— jobs</span>
    </header>
    <!-- Bulk-action toolbar — visible only when ≥1 row is checked -->
    <div class="bulk-toolbar hidden" id="bulk-toolbar">
      <span class="bulk-count" id="bulk-count">0 selected</span>
      <span style="flex:1;"></span>
      <button class="btn" id="bulk-import-sp" title="Open the SP import dialog for every selected client in sequence">📥 Import SP</button>
      <button class="btn" id="bulk-snapshot" title="Open Snapshot for the selected clients in sequence">📸 Snapshot</button>
      <button class="btn" id="bulk-flag" title="Flag a missing item across every selected client">🚩 Flag…</button>
      <button class="btn" id="bulk-copy-issues" title="Copy the consolidated missing-items list for every selected client">📋 Copy issues</button>
      <button class="btn" id="bulk-reaudit" title="Re-audit every selected client">↻ Re-audit</button>
      <button class="btn" id="bulk-clear" title="Clear selection">✕</button>
    </div>
    <div class="list-body" id="list-body" role="listbox" tabindex="0">
      <!-- One row per filtered job -->
    </div>
  </aside>

  <!-- Right pane: detail of selected job -->
  <section class="detail-pane" id="detail-pane">
    <div id="detail-empty" class="empty-state">
      <div class="empty-emoji">📋</div>
      <div class="empty-title">Pick a job from the list</div>
      <div class="empty-sub">or use ↑ / ↓ to step through them</div>
    </div>
    <article id="detail-view" class="detail-view hidden">
      <!-- Detail of selected job — built by app.js -->
    </article>
  </section>
</main>

<div id="loading-state" class="loading-state hidden">
  <div class="spinner"></div>
  <div class="loading-label" id="loading-label">Running audit…</div>
</div>

<footer class="statusbar">
  <span id="status-counts">—</span>
  <span id="status-msg" class="status-msg"></span>
</footer>

<script src="../web_shared/audit_detail.js?v=20260817c"></script>
<script src="app.js?v=20260818a"></script>
</body>
</html>
